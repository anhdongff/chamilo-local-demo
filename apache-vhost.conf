
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/chamilo/public

    <Directory /var/www/chamilo/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog ${APACHE_LOG_DIR}/chamilo-error.log
    CustomLog ${APACHE_LOG_DIR}/chamilo-access.log combined
</VirtualHost>
